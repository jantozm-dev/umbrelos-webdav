# -*- mode: yaml -*-
# not actually YAML but lets pretend:
# vim: ft=yaml:

# copyparty server configuration for the umbrelOS WebDAV app.
#
# The login credentials are not stored here. docker-compose.yml passes
#   -a umbrel:${APP_PASSWORD}
# on the command line, where ${APP_PASSWORD} is umbrelOS's per-install app
# password (Settings → Default credentials on the app's card).

[global]
  # port inside the container; app_proxy connects here (APP_PORT in
  # docker-compose.yml) and umbrelOS publishes it as port 3919.
  p: 3923

  # container/LAN networking only: reject connections from internet IPs.
  # the app_proxy is the only expected client anyway.
  ipa: lan

  # shown in the browser top-left, in the tab title, and in mDNS announcements
  name: WebDAV

  # theme 0 = classic dark. pick a different one via the UI settings at any time
  theme: 0

  no-robots     # tell search engines to go away
  dav-auth      # require login for all WebDAV clients (fixes a windows bug
                # where anonymous read prevents login for writes)
  usernames     # the login form asks for username + password, matching what
                # umbrelOS shows under Default credentials
  daw           # let WebDAV clients modify/overwrite existing files
                # (most clients unfortunately need this permission)

  # keep thumbnails and other caches in app data instead of inside the user's
  # folders; add `e2dsa` here if you want the search tab (the first scan can
  # take a while on large drives)
  hist: /cfg/hists/

[/]
  # all storage roots mounted at /roots (Home, External drives, Network shares)
  /roots
  accs:
    # umbrel gets read/write/move/delete/admin. admin is what unlocks the
    # control panel extras (server info, connect instructions, live reload)
    A: umbrel
  flags:
    # allow writes even if a mounted drive or network share looks unusual to
    # copyparty; without this some mounts get treated as temporary ramdisks
    wram
